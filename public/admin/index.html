<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>YMBOX CMS</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  /* Modern sidebar */
  [class*="Sidebar"]{background:#1a1a2e!important;border-right:1px solid rgba(255,255,255,0.05)!important}
  [class*="Sidebar"] a,[class*="Sidebar"] span{color:#a0a0c0!important}
  [class*="Sidebar"] [class*="active"]{color:#fff!important;background:rgba(124,58,237,0.3)!important}
  /* Softer cards */
  [class*="Card"]{border-radius:10px!important;border:1px solid rgba(0,0,0,0.06)!important;box-shadow:0 2px 8px rgba(0,0,0,0.04)!important}
  /* Purple accent buttons */
  button[class*="primary"],a[class*="primary"]{background:#7C3AED!important;border-radius:8px!important}
  button[class*="primary"]:hover,a[class*="primary"]:hover{background:#6D28D9!important}
  /* Clean inputs */
  input,textarea,select{border-radius:6px!important;border:1px solid #d0d0d0!important;padding:8px 12px!important}
  input:focus,textarea:focus,select:focus{border-color:#7C3AED!important;box-shadow:0 0 0 3px rgba(124,58,237,0.12)!important}
  /* Top bar */
  [class*="AppHeader"]{background:#fff!important;border-bottom:1px solid #eee!important}
</style>
</head><body>
<script src="/admin/decap-cms.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){CMS.init()})</script>
</body></html>
