<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>YMBOX CMS</title></head>
<body><div id="app"></div>
<script src="/admin/decap-cms.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  try {
    DecapCms.init({
      config: {
        backend: {
          name: "github",
          repo: "ARIEZY997/yuanmei-printing",
          branch: "master",
          base_url: "https://decap-cms-oauth.vercel.app",
          auth_endpoint: "auth",
          client_id: "Ov23lihQkBP0O5pz8LBj"
        },
        load_config_file: false,
        media_folder: "public/images",
        public_folder: "/images",
        collections: [{
          name: "blog", label: "Blog", folder: "src/content/blog", create: true,
          fields: [
            {label:"Title",name:"title",widget:"string"},
            {label:"Body",name:"body",widget:"markdown"}
          ]
        }]
      }
    });
  } catch(e) {
    document.getElementById('app').innerHTML = '<h2>Error: '+e.message+'</h2>';
  }
});
</script>
</body>
</html>
