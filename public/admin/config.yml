backend:
  name: github
  repo: ARIEZY997/yuanmei-printing
  branch: master
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: auth
  client_id: Ov23lihQkBP0O5pz8LBj

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO Title (T)", name: "seo_title", widget: "string", required: false }
      - { label: "Meta Description (D)", name: "seo_description", widget: "text", required: false }
      - { label: "Keywords (K)", name: "seo_keywords", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site TDK Settings"
    extension: "json"
    format: "json"
    files:
      - name: "seo"
        label: "Global SEO"
        file: "src/i18n/en.json"
        fields:
          - { label: "Site Title (T)", name: "title", widget: "string" }
          - { label: "Meta Description (D)", name: "description", widget: "text" }
          - { label: "Keywords (K)", name: "keywords", widget: "string", required: false }

local_backend: false
publish_mode: editorial_workflow
